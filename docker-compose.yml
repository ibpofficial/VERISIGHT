version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: verisight-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verisight_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verisight_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-verisight_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verisight_user} -d ${POSTGRES_DB:-verisight_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: verisight-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-verisight_user}:${POSTGRES_PASSWORD:-verisight_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-verisight_db}
      SECRET_KEY: ${SECRET_KEY:-verisight-super-secret-key-change-in-production-sih2026-mha}
      UPLOAD_DIR: /app/data/uploads
      PROCESSED_DIR: /app/data/processed
      REPORTS_DIR: /app/data/reports
    ports:
      - "8000:8000"
    volumes:
      - verisight-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: verisight-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  verisight-data:

